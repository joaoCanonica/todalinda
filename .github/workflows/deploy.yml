# Deploy na Vercel (sessão 9). O build precisa de ffmpeg (vídeos) e Chromium (imagens Open Graph),
# que o build da Vercel não tem: o site é construído aqui e enviado pronto (vercel deploy --prebuilt).
# Segredos no GitHub: VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID.
# Variáveis por ambiente ficam na Vercel (vercel pull): PUBLIC_SITE_URL, PUBLIC_MODO, PUBLIC_INDEXAR,
# PUBLIC_GOOGLE_REVIEW_URL. Preview: PUBLIC_MODO=preview (noindex). Produção: PUBLIC_MODO=producao.
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ambiente:
        description: 'preview ou production'
        default: preview

jobs:
  deploy:
    runs-on: ubuntu-24.04
    env:
      AMBIENTE: ${{ github.event_name == 'push' && 'production' || inputs.ambiente }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: pnpm
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm dlx vercel@65.9.0 pull --yes --environment=$AMBIENTE --token=${{ secrets.VERCEL_TOKEN }}
      # o build roda as travas (validate-config), as auditorias (compliance, SEO) e confere o vercel.json
      - run: pnpm dlx vercel@65.9.0 build ${{ env.AMBIENTE == 'production' && '--prod' || '' }} --token=${{ secrets.VERCEL_TOKEN }}
      - run: pnpm dlx vercel@65.9.0 deploy --prebuilt ${{ env.AMBIENTE == 'production' && '--prod' || '' }} --token=${{ secrets.VERCEL_TOKEN }}
